spring:
  datasource:
    # Use DB_URL when provided; otherwise, connect to the local MySQL database.
    # The default database name is propertyview, and the default port is 3306.
    url: ${DB_URL:jdbc:mysql://localhost:3306/propertyview}

    # Use DB_USERNAME when provided; otherwise, use the propertyview user.
    username: ${DB_USERNAME:propertyview}

    # Use DB_PASSWORD when provided; otherwise, use an empty password.
    password: ${DB_PASSWORD:}